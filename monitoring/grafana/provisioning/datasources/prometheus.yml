apiVersion: 1

# Recreate the datasource on every start. Without this, a grafana_data volume from an
# earlier run that holds a "Prometheus" datasource with another uid makes provisioning
# fail ("data source not found") and Grafana exits.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    access: proxy
    editable: false
